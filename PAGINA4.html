<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acción Flash - PC Builder Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                linear-gradient(90deg, rgba(0,255,204,0.1) 1px, transparent 1px),
                linear-gradient(rgba(0,255,204,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: circuitMove 20s linear infinite;
            z-index: -1;
        }

        @keyframes circuitMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .header {
            background: rgba(0,255,204,0.1);
            backdrop-filter: blur(20px);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid rgba(0,255,204,0.3);
        }

        .header h1 {
            color: #00FFCC;
            font-size: 2.5rem;
            text-shadow: 0 0 20px rgba(0,255,204,0.5);
            margin-bottom: 10px;
            animation: neonGlow 2s ease-in-out infinite alternate;
        }

        @keyframes neonGlow {
            from { text-shadow: 0 0 20px rgba(0,255,204,0.5); }
            to { text-shadow: 0 0 30px rgba(0,255,204,0.8), 0 0 40px rgba(0,255,204,0.6); }
        }

        .subtitle { color: #aaa; font-size: 1.2rem; }

        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }

        .pc-builder {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            margin-bottom: 40px;
        }

        .build-area {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(0,255,204,0.2);
        }

        .pc-case {
            width: 100%; height: 500px;
            background: linear-gradient(145deg, #2a2a3e, #1f1f33);
            border-radius: 15px;
            position: relative;
            border: 3px solid rgba(0,255,204,0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .component-slot {
            position: absolute;
            border: 2px dashed rgba(0,255,204,0.4);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; color: #aaa;
            cursor: pointer; transition: all 0.3s ease;
            background: rgba(0,255,204,0.05);
            text-align: center; padding: 6px;
        }

        .component-slot:hover { border-color: rgba(0,255,204,0.8); background: rgba(0,255,204,0.1); }

        .component-slot.filled {
            border: 2px solid #00FFCC;
            background: rgba(0,255,204,0.2);
            color: #00FFCC; font-weight: bold;
        }

        /* Posiciones */
        .cpu-slot { top: 20px; left: 20px; width: 120px; height: 80px; }
        .gpu-slot { top: 150px; left: 20px; width: 200px; height: 100px; }
        .ram-slot { top: 20px; right: 20px; width: 100px; height: 120px; }
        .storage-slot { bottom: 80px; left: 20px; width: 150px; height: 60px; }
        .psu-slot { bottom: 20px; right: 20px; width: 120px; height: 80px; }
        .mobo-slot { top: 120px; left: 150px; width: 180px; height: 200px; }

        /* Panel lateral */
        .control-panel {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(0,255,204,0.2);
            height: fit-content;
        }

        .component-category { margin-bottom: 25px; }
        .category-title { color: #00FFCC; font-size: 1.2rem; margin-bottom: 15px; font-weight: 600; }

        .component-item {
            background: rgba(0,255,204,0.1);
            padding: 12px; margin: 8px 0;
            border-radius: 10px; cursor: grab;
            transition: all 0.3s ease;
            border: 1px solid rgba(0,255,204,0.2);
            user-select: none;
        }
        .component-item:hover { background: rgba(0,255,204,0.2); transform: translateX(5px); }
